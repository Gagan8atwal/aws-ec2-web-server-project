name: Remove Temporary Vidger Proof Release

on:
  push:
    branches:
      - vidger-branding-live-proof-20260825

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary public proof release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete vidger-branding-proof-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
