name: Vidger Production Showcase

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vidger-showcase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out showcase harness
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Playwright
        run: npm install --no-save playwright@1.62.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install media inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Generate and inspect Vidger showcase
        run: node qa/vidger-showcase-20260826.mjs

      - name: Upload videos, browser proof, storyboards, frames, and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidger-showcase-${{ github.run_id }}
          path: artifacts/vidger-showcase
          if-no-files-found: warn
          retention-days: 7
