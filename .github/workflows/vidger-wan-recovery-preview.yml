name: Vidger Wan Preview Recovery

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-wan-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out diagnostic harness
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Playwright
        run: npm install --no-save playwright@1.62.1

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Capture authenticated Wan queue diagnostics
        run: node qa/vidger-wan-diagnose-preview.mjs

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidger-wan-diagnostics-${{ github.run_id }}
          path: artifacts/vidger-wan-diagnostics
          if-no-files-found: warn
          retention-days: 7
