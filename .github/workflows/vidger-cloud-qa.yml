name: Vidger Cloud Browser QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out QA harness
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Playwright
        run: npm install --no-save playwright@1.62.1

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Recover submitted Wan jobs without new generation spend
        run: node qa/vidger-recover-wan.mjs

      - name: Upload recovered videos and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidger-wan-recovery-${{ github.run_id }}
          path: artifacts/vidger-recovery
          if-no-files-found: warn
          retention-days: 7
