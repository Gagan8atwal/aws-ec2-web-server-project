name: Vidger Cloud Browser QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out QA harness
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Playwright
        run: npm install --no-save playwright@1.62.1

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run Vidger generation workflow in cloud browser
        run: node qa/vidger-cloud-qa.mjs

      - name: Upload videos, screenshots, trace, and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidger-cloud-qa-${{ github.run_id }}
          path: artifacts/vidger-qa
          if-no-files-found: warn
          retention-days: 7
