name: Vidger Production Browser Matrix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out matrix harness
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Playwright
        run: npm install --no-save playwright@1.62.1

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run live Vidger browser matrix
        run: node qa/vidger-production-matrix.mjs

      - name: Upload videos, browser screenshots, and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidger-production-matrix-${{ github.run_id }}
          path: artifacts/vidger-production-matrix
          if-no-files-found: warn
          retention-days: 7
